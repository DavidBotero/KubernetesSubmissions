name: Delete environment

on:
  delete:

permissions:
  contents: read
  id-token: write

env:
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  BRANCH: ${{ github.event.ref }}

jobs:
  delete-environment:
    name: Delete the branch environment
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: "${{ env.GKE_CLUSTER }}"
          project_id: "${{ secrets.GKE_PROJECT }}"
          location: "${{ env.GKE_ZONE }}"

      - name: Delete the namespace of the branch
        run: |-
          case "$BRANCH" in
            main|project|default|kube-*|gke-*|gmp-*)
              echo "Refusing to delete the protected namespace for branch $BRANCH"
              exit 0
              ;;
          esac
          kubectl delete namespace "$BRANCH" --ignore-not-found --timeout=600s
