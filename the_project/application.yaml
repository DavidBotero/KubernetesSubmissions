apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-project
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DavidBotero/KubernetesSubmissions
    path: the_project
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: project
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
