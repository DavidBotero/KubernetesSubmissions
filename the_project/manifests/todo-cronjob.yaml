apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-random-cron
  namespace: project
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: todo-random
              image: PROJECT/TODO_CRON
              env:
                - name: TODO_BACKEND_URL
                  value: "http://todo-backend-svc:3000"
          restartPolicy: Never
