apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-backup
  namespace: project
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          volumes:
            - name: backup
              emptyDir: {}
            - name: storage-sa-key
              secret:
                secretName: storage-sa-key
          initContainers:
            - name: dump
              image: postgres:18.0
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              command: ["/bin/sh", "-c", 'pg_dump "$DATABASE_URL" > /backup/todos.sql']
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: todo-postgres-secret
                      key: DATABASE_URL
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: gcr.io/google.com/cloudsdktool/google-cloud-cli:alpine
              resources:
                requests:
                  cpu: 25m
                  memory: 96Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              command: ["/bin/sh", "-c"]
              args:
                - |
                  gcloud auth activate-service-account --key-file=/secrets/key.json
                  gcloud storage cp /backup/todos.sql "gs://dwk-gke-233649-todo-backups/todos-$(date -u +%Y%m%dT%H%M%SZ).sql"
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: storage-sa-key
                  mountPath: /secrets
                  readOnly: true
