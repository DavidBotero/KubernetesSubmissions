apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: shared-pongs
          persistentVolumeClaim:
            claimName: pingpong-log-pvc
      containers:
        - name: ping-pong
          image: davidsboteron/ping-pong:2
          volumeMounts:
            - name: shared-pongs
              mountPath: /usr/src/app/files
