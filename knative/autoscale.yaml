apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: autoscale-go
  namespace: knative-demo
spec:
  template:
    metadata:
      annotations:
        # aim for 10 concurrent requests per pod and add pods when there are more
        autoscaling.knative.dev/target: "10"
        autoscaling.knative.dev/max-scale: "6"
    spec:
      containers:
        - image: ghcr.io/knative/autoscale-go:latest
          ports:
            - containerPort: 8080
