apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello
  namespace: knative-demo
spec:
  template:
    metadata:
      name: hello-v2
    spec:
      containers:
        - image: ghcr.io/knative/helloworld-go:latest
          ports:
            - containerPort: 8080
          env:
            - name: TARGET
              value: Knative
  traffic:
    - revisionName: hello-v1
      percent: 75
    - revisionName: hello-v2
      percent: 25
