apiVersion: v1
kind: Namespace
metadata:
  name: knative-demo
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello
  namespace: knative-demo
spec:
  template:
    metadata:
      name: hello-v1
    spec:
      containers:
        - image: ghcr.io/knative/helloworld-go:latest
          ports:
            - containerPort: 8080
          env:
            - name: TARGET
              value: World
